# Builds the desktop installers. Start it from the Actions tab ("Run workflow"),
# by pushing a version tag such as v0.1.0, or automatically when files that
# affect packaging change on main.
name: Build desktop apps

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - ".github/workflows/build.yml"
      - "backend/requirements.txt"
      - "backend/run.py"
      - "backend/scripts/smoke_packaged.py"
      - "frontend/src-tauri/**"

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
          - name: macos-intel
            os: macos-15-intel   # GitHub keeps Intel Mac machines until fall 2027
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # 1. Turn the Python backend into one program file.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build backend program
        working-directory: backend
        shell: bash
        run: |
          # cryptography only from ready-made packages: they carry their own
          # OpenSSL. Built from source on macOS it links to a newer OpenSSL
          # that clashes with Python's own copy inside the packaged program.
          pip install --only-binary cryptography -r requirements.txt pyinstaller
          pip show cryptography | head -2
          pyinstaller --onefile --name backend --noconfirm \
            --collect-submodules uvicorn \
            --collect-submodules ccxt \
            --collect-data certifi \
            run.py

      # Run the packaged backend like the app does and fetch real market lists.
      - name: Check packaged backend
        working-directory: backend
        shell: bash
        run: |
          EXT=""
          if [ "$RUNNER_OS" = "Windows" ]; then EXT=".exe"; fi
          python scripts/smoke_packaged.py "dist/backend$EXT"

      - uses: dtolnay/rust-toolchain@stable

      # 2. Put it where Tauri expects it: binaries/backend-<platform name>.
      - name: Place backend next to the app
        shell: bash
        run: |
          TRIPLE=$(rustc -Vv | sed -n 's/^host: //p')
          EXT=""
          if [ "$RUNNER_OS" = "Windows" ]; then EXT=".exe"; fi
          mkdir -p frontend/src-tauri/binaries
          cp "backend/dist/backend$EXT" "frontend/src-tauri/binaries/backend-$TRIPLE$EXT"
          ls -l frontend/src-tauri/binaries

      # 3. Build the desktop app around the screen and the backend.
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Build desktop app
        working-directory: frontend
        shell: bash
        run: |
          npm install
          npx tauri icon src-tauri/app-icon.png
          npx tauri build

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.name }}
          path: |
            frontend/src-tauri/target/release/bundle/msi/*.msi
            frontend/src-tauri/target/release/bundle/nsis/*.exe
            frontend/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
