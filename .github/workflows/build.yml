# Builds the desktop installers. Start it from the Actions tab ("Run workflow"),
# or by pushing a version tag such as v0.1.0.
name: Build desktop apps

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
          - name: macos-intel
            os: macos-15-intel   # GitHub keeps Intel Mac machines until fall 2027
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # 1. Turn the Python backend into one program file.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build backend program
        working-directory: backend
        shell: bash
        run: |
          pip install -r requirements.txt pyinstaller
          pyinstaller --onefile --name backend --noconfirm \
            --collect-submodules uvicorn \
            --collect-submodules ccxt \
            --collect-data certifi \
            run.py

      - uses: dtolnay/rust-toolchain@stable

      # 2. Put it where Tauri expects it: binaries/backend-<platform name>.
      - name: Place backend next to the app
        shell: bash
        run: |
          TRIPLE=$(rustc -Vv | sed -n 's/^host: //p')
          EXT=""
          if [ "$RUNNER_OS" = "Windows" ]; then EXT=".exe"; fi
          mkdir -p frontend/src-tauri/binaries
          cp "backend/dist/backend$EXT" "frontend/src-tauri/binaries/backend-$TRIPLE$EXT"
          ls -l frontend/src-tauri/binaries

      # 3. Build the desktop app around the screen and the backend.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build desktop app
        working-directory: frontend
        shell: bash
        run: |
          npm install
          npx tauri icon src-tauri/app-icon.png
          npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            frontend/src-tauri/target/release/bundle/msi/*.msi
            frontend/src-tauri/target/release/bundle/nsis/*.exe
            frontend/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
