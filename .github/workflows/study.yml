# Owner's study of 2026-11-09 (read-only experiments on Toobit history; changes nothing in the bot).
name: Study
on:
  workflow_dispatch:
  push:
    branches: [study-2026-11-09]
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt numpy requests
      - uses: actions/cache@v4
        with:
          path: backend/research-data
          key: binance-5m-2024-07-2026-10-v1
      - run: python scripts/research/dl.py
        env:
          RESEARCH_DATA: ${{ github.workspace }}/backend/research-data
      - run: python scripts/study_schools28.py
        env:
          RESEARCH_DATA: ${{ github.workspace }}/backend/research-data
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: study-report
          path: backend/study-report.md
