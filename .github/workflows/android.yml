# Builds the Android app (engine + screen on the phone, running in the background).
# Download: Actions tab -> "Build Android app" -> the run -> Artifacts -> "android".
name: Build Android app

on:
  workflow_dispatch:
  pull_request:          # also builds the APK for changes waiting to be merged
  push:
    tags: ["v*"]
    branches: [main]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  # aiohttp and its helpers have optional C speed-ups; on Android their pure-Python versions are used.
  AIOHTTP_NO_EXTENSIONS: "1"
  MULTIDICT_NO_EXTENSIONS: "1"
  YARL_NO_EXTENSIONS: "1"
  FROZENLIST_NO_EXTENSIONS: "1"
  PROPCACHE_NO_EXTENSIONS: "1"

jobs:
  engine-check:
    name: Engine with the Android packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install exactly what the phone gets
        run: pip install -r android/app/requirements-android.txt httpx
      - name: Backend tests
        working-directory: backend
        run: python -m unittest discover -s tests -t . -v

  apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # 1. The screen.
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Build the screen
        working-directory: frontend
        run: |
          npm install
          npm run build
      - name: Put the screen and the engine into the app
        run: |
          mkdir -p android/app/src/main/assets
          rm -rf android/app/src/main/assets/web android/app/src/main/python/app
          cp -r frontend/dist android/app/src/main/assets/web
          cp -r backend/app android/app/src/main/python/app

      # 2. The app (Chaquopy needs a Python of the same version on the build machine).
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning title=Signing::no ANDROID_KEYSTORE_BASE64 secret: signed with a temporary key (updates will need uninstalling first)"
          fi
      - name: Build
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace
      - name: Name the file
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/*.apk "out/TradingBot-${{ github.run_number }}.apk"
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*.apk
