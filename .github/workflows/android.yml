# Builds the Android app (engine + screen on the phone, running in the background).
# Download: Actions tab -> "Build Android app" -> the run -> Artifacts -> "android".
name: Build Android app

on:
  workflow_dispatch:
  pull_request:          # also builds the APK for changes waiting to be merged
  push:
    tags: ["v*"]
    branches: [main]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  # aiohttp and its helpers have optional C speed-ups; on Android their pure-Python versions are used.
  AIOHTTP_NO_EXTENSIONS: "1"
  MULTIDICT_NO_EXTENSIONS: "1"
  YARL_NO_EXTENSIONS: "1"
  FROZENLIST_NO_EXTENSIONS: "1"
  PROPCACHE_NO_EXTENSIONS: "1"

jobs:
  engine-check:
    name: Engine with the Android packages (ccxt ${{ matrix.ccxt }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ccxt: ["pinned", "4.5.37"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install exactly what the phone gets
        run: |
          pip install --no-deps -r android/app/requirements-android.txt
          if [ "${{ matrix.ccxt }}" != "pinned" ]; then pip install --no-deps "ccxt==${{ matrix.ccxt }}"; fi
          pip check || true
          pip install httpx   # only for the server tests
      - name: Backend tests
        working-directory: backend
        run: python -m unittest discover -s tests -t . -v
      - name: Real Toobit through ccxt with these packages
        working-directory: backend
        run: |
          python - <<'PY'
          import asyncio
          from app.exchange import MarketService, create_exchange

          async def main():
              service = MarketService(create_exchange("futures"), "futures")
              try:
                  top = await service.top_markets(5)
                  candles = await service.fetch_candles(top[0].symbol, "5m", 50)
                  print("::notice title=Android packages::Toobit OK:", [m.base for m in top], len(candles), "candles")
                  assert top and len(candles) >= 40
              finally:
                  await service.close()

          asyncio.run(main())
          import aiohttp_socks, wsproto, uvicorn, fastapi, pydantic, ccxt
          print("versions: ccxt", ccxt.__version__, "aiohttp", __import__("aiohttp").__version__, "pydantic", pydantic.VERSION)
          PY

  apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # 1. The screen.
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Build the screen
        working-directory: frontend
        run: |
          npm install
          npm run build
      - name: Put the screen and the engine into the app
        run: |
          mkdir -p android/app/src/main/assets
          rm -rf android/app/src/main/assets/web android/app/src/main/python/app
          cp -r frontend/dist android/app/src/main/assets/web
          cp -r backend/app android/app/src/main/python/app

      # 2. The app (Chaquopy needs a Python of the same version on the build machine).
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning title=Signing::no ANDROID_KEYSTORE_BASE64 secret: signed with a temporary key (updates will need uninstalling first)"
          fi
      - name: Build
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace
      - name: Name the file
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/*.apk "out/TradingBot-${{ github.run_number }}.apk"
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*.apk

  emulator-test:
    name: Start the app on an Android 14 emulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Build the screen and put it and the engine into the app
        run: |
          (cd frontend && npm install && npm run build)
          mkdir -p android/app/src/main/assets
          cp -r frontend/dist android/app/src/main/assets/web
          cp -r backend/app android/app/src/main/python/app
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build (with the emulator's processor type)
        working-directory: android
        run: gradle assembleRelease -PemulatorTest --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, start, and ask the engine
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash android/emulator_check.sh
